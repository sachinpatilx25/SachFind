<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <title>SACH.IN</title>
    <meta name="description"
        content="SACH.IN is a clean minimalist search dashboard, movie suggestion engine, YouTube viewer, and link vault built for simplicity and speed.">
    <link rel="canonical" href="./">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="./">
    <meta property="og:site_name" content="SACH.IN">
    <meta property="og:title" content="SACH.IN — Minimalist Search Dashboard">
    <meta property="og:description"
        content="Clean minimalist search dashboard, movie engine, and personal link vault.">
    <meta property="og:image" content="icon.svg">
    <meta property="og:image:type" content="image/svg+xml">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">
    <meta property="og:image:alt" content="SACH.IN Logo">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="SACH.IN — Minimalist Search Dashboard">
    <meta name="twitter:description"
        content="Clean minimalist search dashboard, movie engine, and personal link vault.">
    <meta name="twitter:image" content="icon.svg">
    <meta name="twitter:image:alt" content="SACH.IN Logo">

    <!-- Preconnect & DNS Prefetch -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://www.google.com">
    <link rel="dns-prefetch" href="https://sg.media-imdb.com">
    <link rel="dns-prefetch" href="https://i.ytimg.com">
    <link rel="dns-prefetch" href="https://api.microlink.io">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon.svg">
</head>

<body>
    <a href="#search-input" class="skip-link">Skip to search</a>

    <div class="app-container">
        <!-- HEADER -->
        <header class="header" role="banner">
            <div class="brand-section">
                <a href="./" class="brand-logo" aria-label="SACH.IN Home">
                    <span class="brand-title">✦-- S💀ch.🖕🏻n --✦</span>
                </a>
            </div>
            <nav class="header-actions" aria-label="Quick actions">
                <button type="button" id="btn-reset-sources" class="btn-icon-text" title="Reset defaults"
                    aria-label="Reset search engines to default list">
                    <svg class="btn-icon-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                        <path d="M3 3v5h5"></path>
                    </svg>
                    <span class="sr-only">Reset defaults</span>
                </button>
            </nav>
        </header>

        <!-- SEARCH COCKPIT -->
        <section class="search-cockpit" aria-label="Search Cockpit">
            <div class="search-input-wrapper">
                <div class="search-icon-prefix" aria-hidden="true">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </div>
                <input type="text" id="search-input" class="search-input"
                    placeholder="Search movies, stream, or paste URL... (Press / to focus)" autocomplete="off"
                    spellcheck="false" autofocus role="combobox" aria-autocomplete="list" aria-expanded="false"
                    aria-controls="suggestions" aria-haspopup="listbox" aria-label="Search query or destination URL">
                <button type="button" id="search-clear" class="search-input-clear" title="Clear search"
                    aria-label="Clear search input">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
                <button type="button" id="search-button" class="search-submit-btn"
                    aria-label="Execute search">
                    <span id="searchBtnText">Search</span>
                    <kbd class="search-enter-kbd" aria-hidden="true">↵</kbd>
                </button>
            </div>

            <!-- Instant IMDb & URL Suggestions Dropdown -->
            <div id="suggestions" class="suggestions-box" role="listbox" aria-label="Search suggestions"
                aria-live="polite"></div>

            <div class="cockpit-toolbar">
                <div class="cockpit-stats">
                    <span class="status-indicator-dot" aria-hidden="true"></span>
                    <span id="current-query-display" class="query-status" title="Active Query">Ready</span>
                    <span class="stats-sep" aria-hidden="true">·</span>
                    <span id="active-count" class="engines-count">0</span>
                    <span class="engines-label">engines</span>
                </div>
                <div class="cockpit-multi-controls">
                    <label class="cockpit-switch-label" title="After every search, automatically open tabs one by one with 5s delay">
                        <input type="checkbox" id="toggleMultiTab" class="cockpit-switch-input" checked>
                        <span class="cockpit-switch-slider" aria-hidden="true"></span>
                        <span class="cockpit-switch-text">Multi-tab</span>
                    </label>
                    <button type="button" id="btnScopeToggle" class="btn-scope-toggle" title="Click to switch between search engines and all sites">
                        <span id="scopeLabel"></span>
                    </button>
                </div>
            </div>

            <!-- Recent Queries -->
            <div class="recent-searches-row" aria-label="Recent search history" style="display: none;">
                <span class="recent-label">Recent:</span>
                <div id="recent-tags" class="recent-tags-container" role="list"></div>
                <button type="button" id="btn-clear-history" class="btn-clear-history" title="Clear history"
                    aria-label="Clear all recent search queries">Clear</button>
            </div>
        </section>

        <!-- APP / ENGINE TILES GRID -->
        <main id="main-content" role="main">
            <h1 class="sr-only">Search Engines and Quick Launch Grid</h1>
            <div id="apps" class="apps-grid"></div>
            <!-- Add Button Where Apps End -->
            <div class="apps-end-bar">
                <button type="button" id="addAppToggleBtn" class="btn-icon-text btn-add-end" aria-expanded="false"
                    aria-controls="addAppBox" title="Add Search Engine or App" aria-label="Add custom search engine or app">
                    <svg class="btn-icon-svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <span>Add</span>
                </button>
            </div>
        </main>

        <!-- ADD APP DRAWER (Positioned right after apps) -->
        <div id="addAppBox" class="drawer-box" style="display: none;" role="dialog" aria-modal="true"
            aria-labelledby="addAppTitle">
            <div class="drawer-header">
                <span id="addAppTitle" class="drawer-title">+ Add Shortcut / Engine</span>
                <button type="button" id="addAppCancelBtn" class="btn-mini-icon"
                    aria-label="Close add engine drawer">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="drawer-row">
                <input type="text" id="addAppUrlInput" class="form-input"
                    placeholder="URL or Search URL (e.g. twitch.tv or https://site.com/search?q={q})" autocomplete="off"
                    aria-label="Engine target URL">
                <input type="text" id="addAppNameInput" class="form-input" placeholder="Name (optional)"
                    autocomplete="off" aria-label="Engine name">
                <button type="button" id="addAppSubmitBtn" class="btn-action-primary"
                    aria-label="Submit new engine">Add</button>
            </div>
            <div class="drawer-options">
                <label class="drawer-checkbox">
                    <input type="checkbox" id="addAppDirectCheck">
                    <span>Open directly (no search query)</span>
                </label>
            </div>
            <div id="addAppStatus" class="form-status" role="status" aria-live="polite"></div>
        </div>

        <!-- BOTTOM TOOLBAR (Later in Bottom) -->
        <div class="bottom-toolbar">
            <button type="button" id="vaultToggleBtn" class="btn-icon-text btn-later-bottom" aria-expanded="false"
                aria-controls="vaultSection" title="Later &amp; Links" aria-label="Toggle Later drawer">
                <svg class="btn-icon-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span>Later</span>
                <span id="vaultBadge" class="header-badge" aria-label="Saved items in Later">0</span>
            </button>
        </div>

        <!-- MULTIFUNCTION VAULT SECTION (In Bottom) -->
        <section id="vaultSection" class="collapsible-section vault-section" style="display: none;" aria-labelledby="vaultHeading">
            <div class="section-header vault-header">
                <div class="vault-header-left">
                    <h2 id="vaultHeading" class="vault-title">
                        <svg class="vault-title-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        <span>Later &amp; Links</span>
                    </h2>
                    <div class="vault-tabs" role="tablist" aria-label="Vault categories">
                        <button type="button" role="tab" id="vaultTabWl" class="vault-tab active" aria-selected="true" aria-controls="vaultWlPanel">
                            <svg class="tab-svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <polygon points="5 3 19 12 5 21 5 3"></polygon>
                            </svg>
                            <span>Videos</span>
                            <span id="wlCountText" class="badge-count">0</span>
                        </button>
                        <button type="button" role="tab" id="vaultTabLinks" class="vault-tab" aria-selected="false" aria-controls="vaultLinksPanel">
                            <svg class="tab-svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                            </svg>
                            <span>Links</span>
                            <span id="linksCountText" class="badge-count">0</span>
                        </button>
                    </div>
                </div>
                <div class="vault-actions">
                    <button type="button" id="linksRefreshAllBtn" class="btn-icon-text vault-action-btn" title="Refresh links metadata" aria-label="Refresh metadata for saved links" style="display: none;">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                            <path d="M3 3v5h5"></path>
                        </svg>
                        <span>Refresh</span>
                    </button>
                    <button type="button" id="vaultClearBtn" class="btn-mini-danger" aria-label="Clear active vault tab items">
                        <span>Clear</span>
                    </button>
                    <button type="button" id="vaultCloseBtn" class="btn-mini-icon" title="Close Watch Later" aria-label="Close Watch Later drawer">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
            </div>
            
            <div id="vaultWlPanel" role="tabpanel" aria-labelledby="vaultTabWl" class="vault-panel active">
                <div id="wlList" class="cards-grid"></div>
            </div>

            <div id="vaultLinksPanel" role="tabpanel" aria-labelledby="vaultTabLinks" class="vault-panel" style="display: none;">
                <div id="linksList" class="cards-grid"></div>
            </div>
        </section>

        <!-- YOUTUBE RESULTS (Search Triggered) -->
        <section id="ytSection" class="collapsible-section" style="display: none;" aria-labelledby="ytHeading">
            <div class="section-header">
                <h2 id="ytHeading">YouTube Results</h2>
                <div id="ytStatus" class="section-status" role="status" aria-live="polite"></div>
            </div>
            <div id="ytList" class="cards-grid"></div>
        </section>

        <!-- FOOTER -->
        <footer class="footer" role="contentinfo">
            <div class="footer-brand">SACH.IN &copy; 2026</div>
            <div class="footer-hint">Press <kbd>/</kbd> to search</div>
        </footer>
    </div>

    <!-- TOAST CONTAINER -->
    <div id="toast-container" class="toast-container" aria-live="assertive" aria-atomic="true"></div>

    <script src="app.js" defer></script>
</body>

</html>
